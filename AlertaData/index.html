<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <p id="text"></p>

    <script>

        const text = document.getElementById("text")

        let dia_da_semana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"]
        let mes_completo = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"]
        const data = new Date()

        text.textContent = `Hoje é dia ${data.getDate()} de ${mes_completo[data.getMonth()]}, e estamos no ${dia_da_semana[data.getDay()]}`

    </script>

</body>

</html>
